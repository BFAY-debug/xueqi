  <!-- Bold foreground ridge -->
  <path d="M0,370 Q120,310 240,350 Q360,270 500,330 Q620,250 740,310 Q860,260 980,300 Q1100,270 1220,310 Q1320,290 1400,320 L1400,400 L0,400Z"
        fill="#2C2C2C" opacity="0.08"/>
  <!-- Heavy mist at base -->
  <ellipse cx="400" cy="360" rx="250" ry="18" fill="#F5F0E8" opacity="0.5"/>
  <ellipse cx="1000" cy="350" rx="200" ry="15" fill="#F5F0E8" opacity="0.45"/>

    <linearGradient id="near-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C2C2C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2C2C2C" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <!-- Main near range -->
  <path d="M0,360 Q100,280 200,330 Q320,240 440,300 Q560,200 680,280 Q780,220 900,290 Q1000,230 1100,280 Q1200,260 1400,310 L1400,400 L0,400Z"

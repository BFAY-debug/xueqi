<svg xmlns="http://www.w3.org/2000/svg" width="120" height="140" viewBox="0 0 120 140">
  <!-- Flying crane silhouette — traditional ink wash style -->
  <g fill="none" stroke="#2C2C2C" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body -->
    <path d="M48,72 C52,68 58,66 65,67 C70,68 74,70 78,73 C80,75 78,78 74,79 C68,80 58,78 50,76 C48,75 47,73 48,72Z"
          fill="#2C2C2C" fill-opacity="0.07" stroke-width="1" stroke-opacity="0.08"/>
    <!-- Head + neck -->
    <path d="M48,72 C44,68 40,62 38,56 C36,50 38,46 42,44"
          stroke-width="1.5" stroke-opacity="0.08"/>
    <!-- Beak -->
    <path d="M42,44 C38,42 34,43 32,45" stroke-width="1" stroke-opacity="0.07"/>
    <!-- Red crown dot -->
    <circle cx="43" cy="42" r="1.5" fill="#8B2500" fill-opacity="0.15" stroke="none"/>
    <!-- Left wing (upward sweep) -->
    <path d="M55,70 C45,58 30,45 12,35 C8,33 5,34 8,38 C15,42 28,48 38,55"
          stroke-width="1.8" stroke-opacity="0.07" fill="none"/>
    <!-- Left wing feather details -->
    <path d="M20,40 C15,38 10,40 14,44" stroke-width="0.8" stroke-opacity="0.05"/>
    <path d="M28,46 C22,43 16,44 20,48" stroke-width="0.8" stroke-opacity="0.04"/>
    <!-- Right wing (downward sweep) -->
    <path d="M72,74 C82,65 95,55 110,48 C114,46 116,48 112,52 C104,58 92,64 82,70"
          stroke-width="1.8" stroke-opacity="0.07" fill="none"/>
    <!-- Right wing feather details -->
    <path d="M100,52 C106,49 110,50 107,54" stroke-width="0.8" stroke-opacity="0.05"/>
    <path d="M90,58 C96,55 100,56 97,60" stroke-width="0.8" stroke-opacity="0.04"/>
    <!-- Tail feathers -->
    <path d="M78,78 C84,82 92,84 100,82" stroke-width="1.2" stroke-opacity="0.06"/>
    <path d="M76,80 C82,86 90,90 98,88" stroke-width="1" stroke-opacity="0.05"/>
    <!-- Legs (tucked in flight) -->
    <path d="M58,79 C56,85 54,92 52,96" stroke-width="0.8" stroke-opacity="0.05"/>
    <path d="M65,79 C64,85 63,92 62,96" stroke-width="0.8" stroke-opacity="0.05"/>
  </g>
</svg>

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# HTTP -> HTTPS redirect (Cloudflare handles SSL, but keep for direct access)
server {
    listen 80;
    server_name _;
    # Allow certbot challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server (Cloudflare Full strict mode)
server {
    listen 443 ssl http2;
    server_name _;
    charset utf-8;

    # SSL (Let's Encrypt via certbot)
    ssl_certificate /etc/letsencrypt/live/$SSL_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$SSL_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;

    client_max_body_size 15m;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Static files with cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # API proxy
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        resolver 127.0.0.11 valid=10s;
        set $gateway_upstream http://xueqi-gateway:3000;
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # WebSocket proxy for Socket.IO
    location /socket.io/ {
        resolver 127.0.0.11 valid=10s;
        set $study_upstream http://xueqi-study-service:3002;
        proxy_pass $study_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # Upload files
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 7d;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
